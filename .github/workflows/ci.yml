name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  backend:
    name: backend build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: basket
          POSTGRES_PASSWORD: basket-ci
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U basket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # The integration tests create and drop one throwaway database each on this server.
      BASKET_TEST_POSTGRES: Host=localhost;Port=5432;Username=basket;Password=basket-ci;Database=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore backend/Basket.sln
      - run: dotnet build backend/Basket.sln --configuration Release --no-restore
      - run: dotnet test backend/Basket.sln --configuration Release --no-build --verbosity normal

  pc-reader:
    name: pc-reader typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-reader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: pc-reader/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # @lifekit-hq/* come from GitHub Packages; the repo must be allowed to read them.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:prod
      - run: npm run test:ci
      - run: npx playwright install --with-deps chromium
      # The route scan's design judge is a release asset, downloaded once and then cached.
      - uses: actions/cache@v6
        with:
          path: ~/.impeccable
          key: impeccable-${{ hashFiles('frontend/package-lock.json') }}
      # The page specs, the screen check, the route scan (design judge + axe) and the screen baselines
      # (the Linux images in e2e/screens.spec.ts-snapshots, rewritten only by the "Update screen baselines" workflow;
      # a screen with no image fails, so an empty directory fails the run).
      - run: npm run e2e
      - name: Upload the screen diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-baseline-diff
          path: frontend/test-results
          if-no-files-found: ignore

  # Builds the one image natively on arm64 (the VPS's architecture). PRs only prove it builds; a push to main
  # publishes ghcr.io/dsdevq/basket:<full commit SHA>, which the deploy workflow pulls by that SHA. The deploy
  # workflow starts when this whole workflow succeeds, so a commit never deploys without its image.
  image:
    name: image builds
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The npm token goes in as a build secret (@lifekit-hq/* come from GitHub Packages) and never lands in a
      # layer. The :buildcache registry cache is read by every build and written only on a push to main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: ghcr.io/dsdevq/basket:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/dsdevq/basket:buildcache
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/dsdevq/basket:buildcache,mode=max,image-manifest=true,oci-mediatypes=true' || '' }}
