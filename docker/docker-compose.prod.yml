# basket - production stack on the VPS. Project name `basket`: always run it with `-p basket` (the name below
# also pins it), so it never collides with another stack on the box.
#
#   IMAGE_TAG=<full commit SHA> docker/deploy.sh
#
# The app runs the image CI published for one commit, ghcr.io/dsdevq/basket:<IMAGE_TAG>; the deploy pulls it and builds
# nothing, so IMAGE_TAG is required. The secrets are docker/.env.sops (SOPS + age), which deploy.sh decrypts into the git-ignored
# docker/.env; see docs/vps-setup.md and docker/.env.example.
# The app listens on 127.0.0.1:3310 only; Tailscale Funnel (port 10000) is the one public way in.
name: basket

services:
  app:
    image: ghcr.io/dsdevq/basket:${IMAGE_TAG:?set IMAGE_TAG to the full commit SHA to deploy}
    container_name: basket-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3310:3310"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=basket;Username=basket;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file};GSS Encryption Mode=Disable"
      Auth__Origins__0: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in the env file}"
      Auth__BootstrapToken: "${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN in the env file}"
      # The fleet's machine identity (docs/decisions.md "Fleet identity"). Empty = the path is off; neither is a secret.
      FleetAgent__Authority: "${FLEET_AGENT_AUTHORITY:-}"
      FleetAgent__BackchannelAuthority: "${FLEET_AGENT_BACKCHANNEL_AUTHORITY:-}"
      # Sign-in through the org identity provider (Logto), like finance-sentry (docs/decisions.md "Org sign-in"). All empty =
      # passkeys only, as before. The client secret is a secret: it comes from the env file, never from git.
      Auth__Oidc__Authority: "${AUTH_OIDC_AUTHORITY:-}"
      Auth__Oidc__ClientId: "${AUTH_OIDC_CLIENT_ID:-}"
      Auth__Oidc__ClientSecret: "${AUTH_OIDC_CLIENT_SECRET:-}"
      Auth__Oidc__PublicBaseUrl: "${AUTH_OIDC_PUBLIC_BASE_URL:-}"
      Auth__Oidc__BackchannelAuthority: "${AUTH_OIDC_BACKCHANNEL_AUTHORITY:-}"
      TZ: Europe/Dublin
    volumes:
      - keys:/keys
    # `default` reaches db; `identity-oidc` is the external network the identity service (Logto) shares with its on-box
    # clients, so FleetAgent__BackchannelAuthority and Auth__Oidc__BackchannelAuthority = http://logto:3001/oidc resolve
    # (docs/decisions.md "Fleet identity", "Org sign-in").
    # `lifekit-shared` is where the box Prometheus reaches basket-app:3310/metrics (lifekit-stack scrape job `basket`).
    networks: [default, identity-oidc, lifekit-shared]
    # The platform contract (lifekit-stack docs/platform-contract.md): checked by docker/deploy.sh before `up`
    # (--static) and after (--project basket). The loopback port above is the tailnet edge's upstream, so `edge`.
    labels:
      lifekit.contract: "v1"
      lifekit.contract.port: "3310"
      lifekit.contract.health: /api/health
      lifekit.contract.ready: /api/health/ready
      lifekit.contract.metrics: /metrics
      lifekit.contract.ingress: edge
      lifekit.contract.service: basket
    tmpfs:
      - /tmp:size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  db:
    image: postgres:17-alpine
    container_name: basket-db
    restart: unless-stopped
    # A datastore, not a product: no HTTP surface to probe (the contract's `none`). Nothing else reaches it.
    labels:
      lifekit.contract: "none"
    environment:
      POSTGRES_DB: basket
      POSTGRES_USER: basket
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}"
    # Small box, small database: a handful of connections and a modest buffer pool keep it inside 192 MB.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=96MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basket -d basket"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

networks:
  # Created by lifekit-stack's deploy.sh, not by this stack; joined only by the app, never the database.
  identity-oidc:
    external: true
  # Also created by lifekit-stack's deploy; docker/deploy.sh creates it when missing so the deploy order does not matter.
  lifekit-shared:
    external: true

volumes:
  pgdata:
  keys:
